<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生命的锚点 | Anchor of Life</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" title="切换主题">
        <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 4.97 0 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>

    <!-- Sound Selector -->
    <div class="sound-selector">
        <button class="sound-btn" id="soundBtn">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <span id="soundText">音效已开</span>
        </button>
        <div class="sound-menu" id="soundMenu">
            <button class="sound-option active" data-sound="on">开启音效</button>
            <button class="sound-option" data-sound="off">静音</button>
        </div>
    </div>

    <!-- Background Glow -->
    <div class="background-glow">
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
    </div>

    <!-- Main Content -->
    <main class="main-content">
        <h1 class="title">
            <span>生命的锚点</span>
            <span class="title-decoration">Anchor of Life</span>
        </h1>
        <button class="anchor-button" id="btnDraw" title="抽取新名言">
            <svg class="icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="6"/>
            </svg>
        </button>
    </main>

    <!-- Message Card Slider -->
    <div class="message-card" id="sliderContainer">
        <div id="sliderTrack" class="slider-track"></div>
        
        <!-- 卡片控制栏 -->
        <div class="card-footer-controls">
            <button id="langToggle" class="card-control-btn" title="切换显示语言">
                ZH
            </button>
            <div class="card-nav-group">
                <button id="btnPrev" class="card-nav-btn">
                    ← <span>上一条</span>
                </button>
                <button id="btnNext" class="card-nav-btn">
                    <span>下一条</span> →
                </button>
            </div>
        </div>
    </div>

    <!-- Flash Overlay & Particles -->
    <div class="flash-overlay" id="flashOverlay"></div>
    <div class="particles-container" id="particlesContainer"></div>

    <footer class="footer-quote">
        Man is thrown into the world. How you face this state is your true existence.
    </footer>

    <!-- 应用逻辑 -->
    <script src="js/app.js"></script>
</body>
</html>
