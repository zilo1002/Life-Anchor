<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活下去的理由 - Life Anchor</title>
    <meta name="description" content="一个为迷失灵魂提供庇护的数字港湾。当你按下按钮的那一刻，网站用温暖的方式告诉你：你并不孤单，这个世界需要你。">
    <meta name="keywords" content="心理,治愈,温暖,哲学,生命,意义,活下去">
    <meta name="author" content="Life Anchor">

    <!-- Open Graph -->
    <meta property="og:title" content="活下去的理由 - Life Anchor">
    <meta property="og:description" content="一个为迷失灵魂提供庇护的数字港湾">
    <meta property="og:type" content="website">

    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='30' width='80' height='40' rx='20' fill='%238B7355'/><rect x='20' y='40' width='60' height='20' rx='10' fill='%23FAF7F2'/></svg>">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Background Glow Effects -->
    <div class="background-glow">
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
        <div class="glow-orb"></div>
    </div>

    <!-- Sound Selector -->
    <div class="sound-selector">
        <button class="sound-btn" id="soundBtn" aria-label="选择音效">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.252.5-4.02z"/></svg>
            <span id="soundLabel">水滴声</span>
        </button>
        <div class="sound-menu" id="soundMenu">
            <button class="sound-option active" data-sound="water">水滴声</button>
            <button class="sound-option" data-sound="click">轻柔点击</button>
            <button class="sound-option" data-sound="mechanical-red">机械红轴</button>
            <button class="sound-option" data-sound="mechanical-blue">机械青轴</button>
            <button class="sound-option" data-sound="mechanical-brown">机械茶轴</button>
            <button class="sound-option" data-sound="mechanical-silent">静音红轴</button>
            <button class="sound-option" data-sound="bell">风铃</button>
        </div>
    </div>

    <!-- Language Selector -->
    <div class="lang-selector">
        <button class="lang-btn" id="langBtn" aria-label="选择语言">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
            <span id="langLabel">中文</span>
        </button>
        <div class="lang-menu" id="langMenu">
            <button class="lang-option active" data-lang="zh">中文</button>
            <button class="lang-option" data-lang="en">English</button>
            <button class="lang-option" data-lang="both">上英文下中文</button>
        </div>
    </div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 7a5 50 10 0 10 5 5 0 0 0 0-10zM12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 1.42 1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>

    <!-- Particles Container -->
    <div class="particles-container" id="particlesContainer"></div>

    <!-- Flash Overlay -->
    <div class="flash-overlay" id="flashOverlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <h1 class="title">活下去的理由<span class="title-decoration">Life Anchor</span></h1>
        <button class="anchor-button" id="anchorButton" aria-label="按下这个按钮">
            <svg class="icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
        </button>
    </main>

    <!-- Message Card -->
    <div class="message-card" id="messageCard">
        <p class="main-message" id="mainMessage"></p>
        <p class="source" id="storySource"></p>
        <!-- Desktop Navigation Buttons -->
        <div class="nav-buttons-desktop">
            <button class="nav-btn nav-prev" id="navPrev" aria-label="上一条">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <button class="nav-btn nav-next" id="navNext" aria-label="下一条">
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
            </button>
        </div>
        <!-- Mobile Navigation Buttons -->
        <div class="nav-buttons-mobile">
            <button class="nav-btn-mobile nav-prev-mobile" id="navPrevMobile" aria-label="上一条">
                <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                <span>上一条</span>
            </button>
            <button class="nav-btn-mobile nav-next-mobile" id="navNextMobile" aria-label="下一条">
                <span>下一条</span>
                <svg viewBox="0 0 24 24"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
            </button>
        </div>
        <span class="close-hint">点击任意处关闭</span>
    </div>

    <!-- Footer Quote -->
    <footer class="footer-quote">人是被抛入世界的。但如何面对被抛入的状态，才是你真正的存在。</footer>

    <!-- JavaScript -->
    <script src="js/main.js"></script>
</body>
</html>
