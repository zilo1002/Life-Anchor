name: Daily Quotes Generator (Node.js)

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0:00 (北京时间 08:00) 自动执行
  workflow_dispatch: # 支持在 GitHub 界面手动一键触发

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run Node.js generator script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run generate

      - name: Commit & Push updated quotes.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/quotes.json
          git commit -m "chore: auto-generate 30 daily quotes [skip ci]" || exit 0
          git push